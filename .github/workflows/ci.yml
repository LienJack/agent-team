name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # never install git hooks on CI
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      # version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: |
          pnpm lint
          pnpm format:check

      - name: typecheck
        run: pnpm typecheck

      # every package's vitest project, the web component tests (jsdom) included
      - name: test
        run: pnpm test

      # tsc -b --force, then vite build of the board
      - name: build
        run: pnpm build

      - name: boundary check
        run: pnpm check:boundaries

      # openapi.json from the route contracts, then the client types from openapi.json
      - name: generated files up to date
        run: pnpm check:generated

      # anything else the steps above rewrote (formatting, generated files) must be committed
      - name: working tree unchanged
        run: git diff --exit-code

  # The board smoke (spec §14 web): Playwright against the real server with fake runners and the
  # leader off, on loopback ephemeral ports. Playwright's own Chromium is installed here; locally
  # the config falls back to the system Chrome when that browser is absent.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: install the Playwright browser
        run: pnpm --filter @agent-team/web exec playwright install --with-deps chromium

      # vite build of the board, then the smoke test
      - name: e2e
        run: pnpm test:e2e
